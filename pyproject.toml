[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scryapi"
version = "0.1.0"
description = "JSON API mirroring Scryfall Oracle card data, with users and decks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4.0,<5",
    "SQLAlchemy>=2.0,<3",
    "requests>=2.32,<3",
    "APScheduler>=3.11,<4",
    "python-dotenv>=1.0",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["scryapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "migrations",
    "scryapi/routes/public_routes.py",  # not valid Python yet; remove with AUDIT C3
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
